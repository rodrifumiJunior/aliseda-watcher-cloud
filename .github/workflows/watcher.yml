name: Aliseda Watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: aliseda-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run watcher
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: ./Watcher.ps1

      - name: Guardar estado
        run: |
          git config user.name "aliseda-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json watcher.log
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza estado [skip ci]"
            git push
          fi
